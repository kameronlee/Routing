[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heat-aware-pedestrian-routing"
version = "0.1.0"
description = "Code and experiments for the Washington, DC heat-aware routing pilot."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Routing contributors" }]
dependencies = [
    "laspy[lazrs]>=2.5",
    "networkx>=3.2",
    "PyYAML>=6.0",
    "rasterio>=1.3",
    "requests>=2.32",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
osm = [
    "geopandas>=0.14",
    "osmnx>=1.9",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "shapely>=2.0",
]

geo = [
    "geopandas>=0.14",
    "osmnx>=1.9",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "requests>=2.32",
    "shapely>=2.0",
]
solweig = [
    "solweig-gpu>=1.2.22",
]
experiments = [
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
